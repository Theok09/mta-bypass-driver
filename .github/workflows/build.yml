name: Build mta_bypass.sys

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Find WDK version
        id: wdk
        shell: pwsh
        run: |
          $kmPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $ver = Get-ChildItem $kmPath | Where-Object { Test-Path "$($_.FullName)\km\ntddk.h" } | Sort-Object Name -Descending | Select-Object -First 1
          "version=$($ver.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "WDK version: $($ver.Name)"

      - name: Build driver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "WDK=C:\Program Files (x86)\Windows Kits\10"
          set "SV=${{ steps.wdk.outputs.version }}"
          cl.exe /c /kernel /W3 /GS- /Gz /O2 /D_AMD64_ /D_WIN64 /DNTDDI_VERSION=0x0A000000 /I"%WDK%\Include\%SV%\km" /I"%WDK%\Include\%SV%\shared" /I"%WDK%\Include\%SV%\km\crt" /Fo mta_bypass.obj mta_bypass.c
          link.exe /OUT:mta_bypass.sys /DRIVER:WDM /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /NODEFAULTLIB /LIBPATH:"%WDK%\Lib\%SV%\km\x64" ntoskrnl.lib hal.lib wmilib.lib mta_bypass.obj

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: mta_bypass_driver
          path: mta_bypass.sys
          retention-days: 30
